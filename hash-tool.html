<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110f10" />
    <title>Хеш пароля — Коллеги</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=3" />
    <link rel="stylesheet" href="styles.css?v=20260725-17" />
  </head>
  <body class="auth-page helper-page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient__grid"></div><div class="ambient__beam ambient__beam--one"></div><div class="ambient__beam ambient__beam--two"></div><div class="ambient__orb"></div><div class="ambient__noise"></div>
    </div>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="hash-title">
        <a class="brand helper-brand" href="login.html"><svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="12"/><path d="m22 14-9 15h18L22 14Z"/><circle cx="22" cy="14" r="3.2"/><circle cx="13" cy="29" r="3.2"/><circle cx="31" cy="29" r="3.2"/></svg><span>КОЛЛЕГИ</span></a>
        <p class="section-index">СЛУЖЕБНЫЙ ИНСТРУМЕНТ</p>
        <h2 id="hash-title">Хеш пароля</h2>
        <p class="muted">Введите пароль, скопируйте SHA-256-хеш и вставьте его в <code>accounts.js</code> как <code>passwordHash</code>.</p>

        <form class="auth-form" id="hashForm" autocomplete="off">
          <label>
            <span>Пароль</span>
            <input id="passwordInput" type="text" placeholder="Введите пароль" required />
          </label>
          <button class="primary-button" type="submit">Посчитать хеш</button>
        </form>

        <label style="margin-top: 16px; display: block;">
          <span>passwordHash</span>
          <input id="hashOutput" type="text" readonly placeholder="Здесь появится хеш" />
        </label>
        <p class="muted" id="hashStatus" role="status"></p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#hashForm");
      const passwordInput = document.querySelector("#passwordInput");
      const hashOutput = document.querySelector("#hashOutput");
      const hashStatus = document.querySelector("#hashStatus");

      async function sha256Hex(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const hash = await sha256Hex(passwordInput.value);
        hashOutput.value = hash;
        try {
          await navigator.clipboard.writeText(hash);
          hashStatus.textContent = "Хеш посчитан и скопирован в буфер обмена.";
        } catch {
          hashStatus.textContent = "Хеш посчитан. Скопируйте его вручную.";
        }
      });
    </script>
  </body>
</html>
