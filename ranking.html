<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110f10" />
    <title>Рейтинг — Коллеги</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=3" />
    <link rel="stylesheet" href="styles.css?v=20260725-18" />
  </head>
  <body class="ranking-page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient__grid"></div><div class="ambient__beam ambient__beam--one"></div><div class="ambient__beam ambient__beam--two"></div><div class="ambient__orb"></div><div class="ambient__noise"></div><div class="cursor-glow"></div>
    </div>

    <header class="topbar" data-animate="header">
      <a class="brand" href="diary.html" aria-label="Коллеги — дневник">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="12"/><path d="m22 14-9 15h18L22 14Z"/><circle cx="22" cy="14" r="3.2"/><circle cx="13" cy="29" r="3.2"/><circle cx="31" cy="29" r="3.2"/></svg><span>КОЛЛЕГИ</span>
      </a>
      <div class="topbar-actions">
        <a class="nav-button" href="diary.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 17-5-5 5-5M5 12h14"/></svg><span>Дневник</span></a>
        <button class="icon-button" id="logoutButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg><span>Выйти</span></button>
      </div>
    </header>

    <main class="diary-layout ranking-layout">
      <section class="ranking-hero" aria-labelledby="rankingPageTitle" data-animate="hero">
        <p class="eyebrow"><span></span> Лидерборд</p>
        <h1 id="rankingPageTitle">Результат виден.<br /><em>Каждый балл важен.</em></h1>
      </section>

      <section class="ranking-panel glass-panel" aria-labelledby="rankingTitle" data-animate="panel">
        <div class="section-head">
          <div>
            <p class="section-index">РЕЙТИНГ УЧЕНИКОВ</p>
            <h2 id="rankingTitle">Таблица лидеров</h2>
            <p class="section-note" id="rankingPeriodLabel">Средний балл за всё время</p>
          </div>
          <button class="range-button" id="rankingRangeButton" type="button" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Выбрать период</span><svg class="range-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
          </button>
        </div>
        <div class="ranking-list" id="rankingList" aria-live="polite"></div>
      </section>
    </main>

    <div class="range-picker" id="rankingCalendar" hidden>
      <div class="range-picker__head"><div><small>Период рейтинга</small><strong id="rangeDraftLabel">Выберите начало</strong></div><button class="calendar-close" type="button" data-range-action="close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="date-picker-head"><button class="date-nav" type="button" data-range-action="prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><strong class="range-month-title"></strong><button class="date-nav" type="button" data-range-action="next" aria-label="Следующий месяц"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
      <div class="date-weekdays" id="rangeWeekdays"></div><div class="date-days range-days" id="rangeDays"></div>
      <div class="range-legend"><span><i class="legend-start"></i> Начало</span><span><i class="legend-end"></i> Конец</span></div>
      <div class="range-actions"><button class="text-button" type="button" data-range-action="reset">Сбросить</button><button class="primary-button small" type="button" data-range-action="apply">Применить</button></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="firebase-config.js?v=20260701-31"></script><script src="accounts.js?v=20260701-33"></script><script src="app.js?v=20260725-18"></script>
  </body>
</html>
